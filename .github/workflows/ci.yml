name: Build CI & Testing Matrix

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Staged Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Minecraft Server Artifacts
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/minecraft-servers
          key: ${{ runner.os }}-paper-servers-${{ hashFiles('testing/src/main/resources/minecraft-matrix.yml') }}
          restore-keys: |
            ${{ runner.os }}-paper-servers-

      - name: 1. Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: 2. Integration Tests
        run: |
          ./gradlew integrationTest --no-daemon

      - name: Build Plugin Shaded JAR
        run: |
          ./gradlew :bootstrap:shadowJar --no-daemon

      - name: Verify Artifact Integrity & Plugin Metadata
        run: |
          echo "Verifying compiled output artifact..."
          JAR_FILE=$(ls bootstrap/build/libs/KUpdater-*.jar | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::No JAR artifact produced in bootstrap/build/libs/"
            exit 1
          fi
          
          SIZE=$(stat -c%s "$JAR_FILE" 2>/dev/null || stat -f%z "$JAR_FILE")
          echo "Artifact path: $JAR_FILE ($SIZE bytes)"
          if [ "$SIZE" -le 0 ]; then
            echo "::error::Generated JAR artifact is empty (0 bytes)"
            exit 1
          fi

          echo "Inspecting plugin metadata inside JAR..."
          unzip -p "$JAR_FILE" plugin.yml > plugin_extracted.yml
          cat plugin_extracted.yml

          grep -q "name: KUpdater" plugin_extracted.yml || { echo "::error::plugin.yml missing expected name 'KUpdater'"; exit 1; }
          grep -q "main: io.github.kaivian.kupdater.bootstrap.KUpdaterPlugin" plugin_extracted.yml || { echo "::error::plugin.yml missing main class"; exit 1; }

          echo "Verifying compiled classes inside JAR..."
          unzip -l "$JAR_FILE" | grep -q "io/github/kaivian/kupdater/bootstrap/KUpdaterPlugin.class" || { echo "::error::Main class file missing from JAR"; exit 1; }

          echo "Artifact integrity verification PASSED."

      - name: 3. Primary Minecraft Server Smoke Test
        run: |
          ./gradlew minecraftTest --no-daemon

      - name: 4. Version Matrix Compatibility Test
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
        run: |
          ./gradlew compatibilityTest -DmatrixLevel=smoke --no-daemon

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: KUpdater-build
          path: bootstrap/build/libs/*.jar

      - name: Upload Compatibility Reports & Test Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-and-logs
          path: |
            build/reports/
            build/test-results/minecraft/
