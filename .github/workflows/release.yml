name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Release Version Tag vs Gradle Version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          TAG_VERSION="${RAW_TAG#v}"
          echo "Release Git Tag: $RAW_TAG (Parsed Version: $TAG_VERSION)"

          GRADLE_VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          echo "Gradle Project Version: $GRADLE_VERSION"

          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Gradle project version ($GRADLE_VERSION)"
            exit 1
          fi
          echo "Release version validation PASSED."

      - name: Build Release Artifact
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon


      - name: Validate Release Artifact Integrity & Plugin Metadata
        run: |
          RAW_TAG="${{ github.ref_name }}"
          TAG_VERSION="${RAW_TAG#v}"
          JAR_FILE=$(ls bootstrap/build/libs/KUpdater-*.jar | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "::error::Release JAR artifact missing!"
            exit 1
          fi

          SIZE=$(stat -c%s "$JAR_FILE" 2>/dev/null || stat -f%z "$JAR_FILE")
          if [ "$SIZE" -le 0 ]; then
            echo "::error::Release JAR artifact is empty (0 bytes)!"
            exit 1
          fi

          echo "Extracting plugin.yml for verification..."
          unzip -p "$JAR_FILE" plugin.yml > release_plugin.yml
          cat release_plugin.yml

          grep -q "name: KUpdater" release_plugin.yml || { echo "::error::plugin.yml missing 'name: KUpdater'"; exit 1; }
          grep -q "main: io.github.kaivian.kupdater.bootstrap.KUpdaterPlugin" release_plugin.yml || { echo "::error::plugin.yml missing main class"; exit 1; }

          EXTRACTED_VERSION=$(grep "^version:" release_plugin.yml | awk '{print $2}' | tr -d "'\"")
          echo "Extracted plugin.yml version: $EXTRACTED_VERSION"
          if [ "$EXTRACTED_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::plugin.yml version ($EXTRACTED_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

          echo "Release artifact validation PASSED."

      - name: Generate SHA-256 Checksum
        run: |
          RAW_TAG="${{ github.ref_name }}"
          TAG_VERSION="${RAW_TAG#v}"
          JAR_FILE=$(ls bootstrap/build/libs/KUpdater-*.jar | head -n 1)
          CHECKSUM_FILE="bootstrap/build/libs/KUpdater-${TAG_VERSION}.jar.sha256"

          sha256sum "$JAR_FILE" | awk '{print $1}' > "$CHECKSUM_FILE"
          echo "Generated SHA-256 Checksum: $(cat $CHECKSUM_FILE)"

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bootstrap/build/libs/KUpdater-*.jar
            bootstrap/build/libs/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

