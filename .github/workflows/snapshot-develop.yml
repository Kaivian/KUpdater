name: Snapshot Dev Build (develop/test)

on:
  push:
    branches:
      - develop
      - 'test*'
      - 'dev*'

permissions:
  contents: write

concurrency:
  group: snapshot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Snapshot Dev Pre-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Validate Artifact Integrity
        run: |
          JAR_FILE=$(ls bootstrap/build/libs/KUpdater-*.jar | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::Snapshot JAR artifact missing!"
            exit 1
          fi

          echo "Extracted plugin metadata:"
          unzip -p "$JAR_FILE" plugin.yml

      - name: Prepare Snapshot Output File
        run: |
          ORIG_JAR=$(ls bootstrap/build/libs/KUpdater-*.jar | head -n 1)
          SNAPSHOT_JAR="bootstrap/build/libs/KUpdater-snapshot-latest.jar"
          cp "$ORIG_JAR" "$SNAPSHOT_JAR"
          
          sha256sum "$SNAPSHOT_JAR" | awk '{print $1}' > "${SNAPSHOT_JAR}.sha256"

      - name: Create or Update Snapshot GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "dev-snapshot"
          name: "KUpdater Dev Snapshot Build"
          body: |
            ## KUpdater Development Snapshot
            This pre-release is automatically updated whenever code is pushed to testing/development branches (`develop`, `test*`, `dev*`).
            
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            - **Timestamp**: `${{ github.event.head_commit.timestamp }}`
          draft: false
          prerelease: true
          files: |
            bootstrap/build/libs/KUpdater-snapshot-latest.jar
            bootstrap/build/libs/KUpdater-snapshot-latest.jar.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
