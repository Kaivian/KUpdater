[versions]
paper-api = "26.2.build.111-stable"
minecraft = "1.21.4"
junit = "6.1.3"
junit-launcher = "6.1.3"
run-task = "3.1.0"
shadow = "9.6.1"
hikaricp = "7.1.0"
sqlite-jdbc = "3.53.2.1"
mysql-connector = "26.7.0"
postgresql-driver = "42.7.13"
mariadb-driver = "3.5.10"
mssql-driver = "13.4.0.jre11"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-launcher" }

hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
postgresql-driver = { module = "org.postgresql:postgresql", version.ref = "postgresql-driver" }
mariadb-driver = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-driver" }
mssql-driver = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql-driver" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
