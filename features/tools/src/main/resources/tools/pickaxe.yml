# ==============================================================================
#                      KUpdater Pickaxe Module Configuration
# ==============================================================================
# Location: plugins/KUpdater/modules/tools/pickaxe.yml
# ==============================================================================

# Messages shown to players upon actions and usage restriction
messages:
  deny-ownership: "&cThis Pickaxe does not belong to you."
  tool-broken: "&cThis Pickaxe is broken and cannot be used."
  tool-invalid: "&cThis Pickaxe carries an unknown tool ID and cannot be used."
  tool-lost: "&cThis Pickaxe is lost and cannot be used."
  already-own-pickaxe: "&c★ You already own a Pickaxe! If you lost your pickaxe, use &e/kup recover&c to claim it back."
  first-pickaxe-crafted: "&a★ Congratulations! You successfully crafted your first Wooden Pickaxe. Mine blocks to gain XP and upgrade your tool!"
  vanilla-crafting-disabled: "&c★ Vanilla pickaxe crafting is disabled! Upgrade your Wooden Pickaxe through tier progression."
  not-max-level-upgrade: "&cThis Pickaxe is not at max level or max XP for tier upgrade."
  not-max-level-upgrade-smithing: "&cThis Diamond Pickaxe is not at max level or max XP for Netherite upgrade."
  tier-upgraded: "&a★ Upgraded Pickaxe Tier to &e%tier% Level %level%&a!"
  level-upgraded: "&a▲ Your Pickaxe upgraded to &e%tier% Level %level%&a!"
  recover-no-pickaxe: "&c★ You do not own a Pickaxe yet! Craft a Wooden Pickaxe for the first time."
  recover-already-in-inventory: "&c★ Your Pickaxe is already in your inventory!"
  recover-success: "&a★ Recovery successful! You received your &e%tier% Level %level%&a."
  reload-success: "&a★ [KUpdater] Configuration reloaded successfully in %duration%ms!"
  no-permission: "&cYou do not have permission to execute this command."

# ==============================================================================
#                      Pickaxe Recovery System Settings
# ==============================================================================
recovery:
  enabled: true
  permission: "kupdater.tool.recover"
  admin-force-permission: "kupdater.tool.admin.force"

  gui:
    enabled: true
    title: "&8Pickaxe Recovery"
    rows: 5
    # When enabled, clicking the action button requires a 3-second confirmation countdown
    confirm-on-recovery: true
    confirm-delay-ticks: 60

  limits:
    maximum-recoveries: -1

  penalties:
    durability:
      enabled: true
      base-percent: 20.0
      increment-percent: 10.0
      maximum-percent: 80.0

    currency:
      enabled: true
      base: 500.0
      increment: 250.0
      maximum: 5000.0

    items:
      enabled: true
      base-multiplier: 1.0
      increment-multiplier: 0.5
      maximum-multiplier: 5.0
      tier-requirements:
        WOODEN:
          - material: OAK_PLANKS
            amount: 4
        STONE:
          - material: COBBLESTONE
            amount: 8
        COPPER:
          - material: COPPER_INGOT
            amount: 4
        IRON:
          - material: IRON_INGOT
            amount: 4
        GOLD:
          - material: GOLD_INGOT
            amount: 4
        DIAMOND:
          - material: DIAMOND
            amount: 2
        NETHERITE:
          - material: NETHERITE_SCRAP
            amount: 2
          - material: DIAMOND
            amount: 1

    cooldown:
      enabled: true
      base-seconds: 21600
      increment-seconds: 7200
      maximum-seconds: 86400

  messages:
    not-lost: "&c★ Recovery unavailable: Your pickaxe is not in a LOST state."
    broken-cannot-recover: "&c★ Recovery unavailable: Your pickaxe is broken, not lost. Repair it instead!"
    on-cooldown: "&c★ Recovery is on cooldown! Please wait %remaining%."
    insufficient-funds: "&c★ You need $%cost% to recover your pickaxe (Balance: $%balance%)."
    missing-items: "&c★ You do not have all required items for recovery."
    inventory-full: "&c★ Recovery unavailable: You need at least 1 free inventory slot."
    economy-unavailable: "&c★ Recovery unavailable: Economy provider (Vault) is currently disabled."
    already-processing: "&c★ Recovery transaction is already processing. Please wait."
    max-recoveries: "&c★ You have reached the maximum allowed recoveries (%max%)."

# Legacy message fallback keys (backward compatibility)
deny-message: "This Pickaxe does not belong to you."
broken-message: "This Pickaxe is broken and cannot be used."
invalid-message: "This Pickaxe carries an unknown tool ID and cannot be used."

# Allow players to accumulate XP into a pool when reaching max level of their tier
# Stored XP is automatically applied upon upgrading to the next tier.
allow-overflow-xp-pool: true
max-overflow-xp-pool: 10000

# Maximum visible characters per line before auto word-wrapping lore text (0 to disable)
lore-max-line-length: 33

# Custom Item Display Names
display-name: "&f%material% Pickaxe &8(Lvl %level%)"
broken-display-name: "&cBroken %material% Pickaxe"
lost-display-name: "&e%material% Pickaxe (Lost)"

# Custom Lore Formatting
# Supported Placeholders:
# %material%, %tier%, %next_tier%, %level%, %next_level%, %xp%, %max_xp%, %xp_formatted%, %max_xp_formatted%,
# %percentage%, %progress_bar%, %speed%, %mining_speed%, %current%, %durability%,
# %max%, %max_durability%, %state%, %overflow_xp%, %xp_pool%
lore:
  - ""
  - "&7Mining Speed: &a%speed%"
  - "&7Durability: &f%current%/%max%"
  - ""
  - "&7Progress to Level %next_level%: &a%percentage%%"
  - "%progress_bar%&r &a%xp%&7/&a%max_xp% &7XP"

# Progress Bar Settings
# Uses spaces " " with bold (&l) and strikethrough (&m) for thick continuous line progress bars
progress-bar:
  symbol: " "
  length: 22
  completed-color: "&a&l&m"
  remaining-color: "&8&l&m"

# Upgrade instruction guide appended to item lore / chat upon reaching max level of current tier
max-level-guide:
  crafting: "&e⚡ Reached max level! Upgrade with &f%upgrade_amount% %upgrade_item%&e in Crafting Table."
  smithing: "&e⚡ Reached max level! Upgrade with &f%upgrade_amount% %upgrade_item%&e in Smithing Table."

# Text shown when reaching maximum level with no further tier upgrades available
max-level-reached-text: "&a&l✦ MAX LEVEL REACHED ✦"

# Text shown for stored/overflow XP pool display
# Supported Placeholders: %stored_xp%, %overflow_xp%, %xp_pool%
stored-xp-text: "&7Stored XP: &e%stored_xp%"

# List of blocks that are considered Pickaxe blocks for Mining Speed boost application.
# Mining these blocks with a Pickaxe activates the Mining Speed bonus.
mineable-blocks:
  - "STONE"
  - "COBBLESTONE"
  - "MOSSY_COBBLESTONE"
  - "GRANITE"
  - "DIORITE"
  - "ANDESITE"
  - "DEEPSLATE"
  - "COAL_ORE"
  - "DEEPSLATE_COAL_ORE"
  - "COPPER_ORE"
  - "DEEPSLATE_COPPER_ORE"
  - "IRON_ORE"
  - "DEEPSLATE_IRON_ORE"
  - "GOLD_ORE"
  - "DEEPSLATE_GOLD_ORE"
  - "REDSTONE_ORE"
  - "DEEPSLATE_REDSTONE_ORE"
  - "LAPIS_ORE"
  - "DEEPSLATE_LAPIS_ORE"
  - "DIAMOND_ORE"
  - "DEEPSLATE_DIAMOND_ORE"
  - "EMERALD_ORE"
